# One toolchain for developers, git hooks and CI: `mise install`, then `mise run setup`.
min_version = "2026.11.5"

[tools]
# GitHub Pages builds this site with Ruby 3.3 and the github-pages gem; match it locally.
ruby = "3.3.13"
hk = "2.11.1"
pkl = "0.33.0"
rumdl = "0.3.2"
typos = "1.52.0"
lychee = "0.24.2"
betterleaks = "1.10.0"
osv-scanner = "2.7.1"

[env]
BUNDLE_PATH = "vendor/bundle"

[tasks.setup]
description = "Install gems and the git hooks"
run = ["bundle install", "hk install"]

[tasks.serve]
description = "Serve the site locally with live reload"
run = "bundle exec jekyll serve --livereload"

[tasks.build]
description = "Build the site the way GitHub Pages does"
run = "bundle exec jekyll build"

[tasks.check]
description = "Run every check, the same set CI runs"
run = "hk check --all"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"
