# One toolchain for developers, git hooks and CI: `mise install`, then `mise run setup`.
min_version = "2026.11.5"

[tools]
# The deploy workflow builds with this Node too, through mise.
node = "24.22.1"
hk = "2.11.1"
pkl = "0.33.0"
rumdl = "0.3.2"
typos = "1.52.0"
lychee = "0.24.2"
betterleaks = "1.10.0"
osv-scanner = "2.7.1"
jactionlint = { version = "2.5.0", workflow = "release.yaml" }

[tasks.setup]
description = "Install npm packages and the git hooks"
run = ["npm ci", "hk install"]

[tasks.serve]
description = "Serve the site locally with live reload"
run = "npm run dev"

[tasks.build]
description = "Build the site into dist/"
run = "npm run build"

[tasks.check]
description = "Run every check, the same set CI runs"
run = "hk check --all"

[tasks.fix]
description = "Apply the automatic fixes"
run = "hk fix --all"
