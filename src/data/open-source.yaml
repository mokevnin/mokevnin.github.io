- name: "dev-quality-gates"
  url: "https://github.com/mokevnin/dev-quality-gates"
  description: "курируемый список инструментов, которые проверяют соблюдение стандартов разработки: по одному рекомендованному инструменту на каждую задачу"
- name: "easement"
  url: "https://github.com/mokevnin/easement"
  description: "архитектурный quality gate для многоязычных кодовых баз: описываете компоненты и разрешённые зависимости, сборка падает, если код от них отходит"
  tag: "Rust"
- name: "heavy"
  url: "https://github.com/mokevnin/heavy"
  description: "общий для всей машины счётчик слотов для тяжёлых команд, чтобы десяток агентов и чекаутов не запускали `go test` и `tsc` одновременно"
  tag: "Rust"
- name: "schemalens"
  url: "https://github.com/mokevnin/schemalens"
  description: "проверка расхождений между моделями (ent, gorm, bun) и живой схемой базы данных, с отчётом для агентов"
  tag: "Go"
- name: "dbcleaner"
  url: "https://github.com/mokevnin/dbcleaner"
  description: "возвращает базу данных в исходное состояние после каждого Go-теста, аналог DatabaseCleaner из Ruby"
  tag: "Go"
- name: "CrossMatch"
  url: "https://t.me/crossmatch_bot"
  description: "Telegram-бот, который подбирает каналы для взаимного пиара (в разработке, [GitHub](https://github.com/mokevnin/crossmatch))"
