- period: "2007–2008"
  text: "Начал свой путь с PHP в квартирной веб-студии на коломенской в Москве. За три месяца примерно понял как писать код и ушел работать в контент-провайдер, который делал разное для телекомов (мегафон и т.п.). Там проработал уже почти год, когда компанию купил более крупный бизнес и началась реструктуризация. После этого я попал в небольшой стартап, который через три месяца стал сокращаться и меня попросили уйти."
- period: "2009–2010"
  text: "Еще один стартап (starlook.ru, уже не существует), где я занял лидирующую роль. Собрал небольшую команду и два года спокойно работал прокачиваясь в архитектуре. Начал писать на хабре, посещать конференции и даже выступать на них. В процессе родилась идея перейти в Ruby, поэтому в свободное время стал прокачиваться и готовиться к трудоустройству в Undev"
- period: "2010"
  text: "Устроился на работу в Undev, где занимался бекендами на Ruby On Rails. Почему-то меня хватило буквально на 4 месяца, почувствовал выгорание (до сих пор не понял почему). Перешел работать в Qik (был куплен Skype) в Зеленограде. Там меня тоже хватило на 4 месяца. Стало понятно, что нужно кардинальное изменение, поэтому я все оставил и уехал из Москвы в Ульяновск, чтобы сэкономить и попробовать запустить свой собственный бизнес"
- period: "2011"
  text: "Почти год занимался собственным аутсорсом. Набирал ребят, учил и формировал команды под проекты заказчиков, которые шли через знакомых. Понял что не мое. В это время позвонили из Undev и предложили возглавить подразделение, которое надо было организовать в Ульяновске, чтобы обеспечить кадрами компанию. Я согласился."
- period: "2011–2014"
  text: "Пожалуй самые классные годы, когда я занимался организацией филиала компании Undev в Ульяновске. Большая часть времени уходила на найм и прокачку начинающих программистов. Мы отстроили целую систему с привозом ребята из разных регионов и эффективной подготовкой к продакшену буквально в течение 4 месяцев (Рассказывал о ней на конференции AgileDay’s 2015). Поучаствовал в запуске конференции “Стачка” и провел один выездной RailsClub, начал активно формировать комьюнити, проводить митапы и преподавать в университете. Помог еще нескольким компаниям открыть филиалы в Ульяновске. В какой-то момент даже стал немного известен как человек, который может организовать с нуля работу подразделения программистов в регионе. Было предложение делать то же самое в Аргентине, но почему-то не поехал."
- period: "2013 — по сейчас"
  text: "Хекслет :) До 2015 года совмещал его с аутсорсом в Кайдзен, потом полностью переключился на Хекслет."
- period: "2016–2019"
  text: "Активно занимался консалтингом. Погружался в компании (от пятидесяти человек до тысяч человек), помогал с наймом, отстраиванием инженерной культуры и повышением квалификации инженеров."
