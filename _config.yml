  Ссылки на статьи, видео и другое
lang: ru
url: "https://mokevnin.github.io"
baseurl: ""

author: Кирилл Мокевнин
email: mokevnin@gmail.com
twitter_username: mokevnin
github_username: mokevnin
linkedin_username: mokevnin
youtube_username: mokevnin

# No theme: the layouts and the Tailwind styles live in this repository.
# Null rather than absent, because the github-pages gem otherwise falls back to jekyll-theme-primer.
theme: null

# Title, description and Open Graph tags in the <head>.
plugins:
  - jekyll-seo-tag

# Repository tooling, not site content. Jekyll 3 replaces its default list, so the defaults are repeated.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - .lycheecache
  - AGENTS.md
  - README.md
  - "*.toml"
  - hk.pkl
