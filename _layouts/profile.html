---
layout: default
---
<article class="profile">
  <header class="profile-hero">
    <img class="profile-avatar" src="https://github.com/{{ site.github_username | cgi_escape }}.png?size=240" alt="" width="120" height="120">
    <h1 class="profile-name">{{ site.author | escape }}</h1>
  </header>

  {{ content }}
</article>
