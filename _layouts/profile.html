---
layout: default
---
<article class="profile">
  <header class="mt-4 mb-5 flex items-center gap-4 sm:gap-6">
    <img class="size-20 flex-none rounded-full shadow-[0_0_0_4px_var(--color-surface),0_0_0_5px_var(--color-line)] sm:size-[120px]"
         src="https://github.com/{{ site.github_username | cgi_escape }}.png?size=240" alt="" width="120" height="120">
    <h1 class="text-[30px]/[1.1] font-bold tracking-[-0.02em] sm:text-[40px]/[1.1]">{{ site.author | escape }}</h1>
  </header>

  {{ content }}
</article>
