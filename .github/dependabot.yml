version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One pull request a week instead of one per package; Astro, Vite and Tailwind move together.
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # @astrojs/check peers on typescript ^5 || ^6. Drop this once it accepts the next major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
