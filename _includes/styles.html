<style type="text/tailwindcss">
  /* Colors are theme variables, so utilities like text-ink or bg-accent-soft exist
     and the dark scheme only swaps the values. */
  @theme {
    --color-ink: #1d2127;
    --color-muted: #6b7280;
    --color-page: #fbfbfa;
    --color-surface: #fff;
    --color-line: #e5e7eb;
    --color-accent: #2f5bd3;
    --color-accent-soft: #edf2fd;
  }

  @layer base {
    @media (prefers-color-scheme: dark) {
      :root {
        --color-ink: #e6e8eb;
        --color-muted: #9ca3af;
        --color-page: #121417;
        --color-surface: #1b1e23;
        --color-line: #2c3038;
        --color-accent: #8ab0ff;
        --color-accent-soft: #1d2638;
      }
    }

    /* Markdown output: kramdown cannot put classes on these elements, and preflight resets them. */
    .profile p,
    .profile ul {
      @apply mb-4;
    }

    .profile a {
      @apply text-accent hover:underline;
    }

    .profile h2 {
      @apply mt-14 mb-4 scroll-mt-[110px] text-[26px] font-bold tracking-[-0.01em];
    }

    .profile code {
      @apply rounded border border-line bg-accent-soft px-1 font-mono text-[0.9em];
    }
  }

  /* Classes set on blocks in index.md with kramdown's {: .name} syntax. */
  @layer components {
    .lead {
      @apply text-[17px]/relaxed sm:text-[19px]/relaxed;
    }

    .note {
      @apply text-muted;
    }

    /* Section navigation, generated by kramdown from the h2 headings.
       One scrollable row on a phone instead of several wrapped ones. */
    #markdown-toc {
      @apply sticky top-0 z-10 mt-7 mb-2 flex flex-nowrap gap-1 overflow-x-auto border-b border-line bg-page py-2.5 sm:flex-wrap sm:overflow-visible;
      /* Paint the background edge to edge, so content scrolling under the bar does not show at its sides. */
      box-shadow: 0 0 0 100vmax var(--color-page);
      clip-path: inset(0 -100vmax);
      scrollbar-width: none;
    }

    #markdown-toc li {
      @apply flex-none;
    }

    #markdown-toc a {
      @apply block rounded-full px-3 py-1 text-sm whitespace-nowrap text-muted hover:bg-accent-soft hover:text-accent hover:no-underline;
    }

    /* Projects as cards */
    .cards {
      @apply grid grid-cols-1 gap-4 sm:grid-cols-2;
    }

    .cards > li {
      @apply rounded-xl border border-line bg-surface px-5 py-[18px] text-[15px]/[1.55] transition hover:border-accent hover:shadow-[0_4px_16px_rgb(0_0_0/0.06)];
    }

    .cards > li > strong:first-child {
      @apply text-[17px];
    }

    .cards-compact > li {
      @apply px-4 py-3.5 text-sm;
    }

    .cards-compact > li > strong:first-child {
      @apply font-mono text-[15px];
    }

    /* Channel and profile links as pills */
    .pills {
      @apply mb-5 flex flex-wrap gap-2.5;
    }

    .pills a {
      @apply inline-block rounded-full bg-accent-soft px-4 py-2 font-medium hover:bg-accent hover:text-surface hover:no-underline;
    }

    /* Long lists of talks, podcasts and texts */
    .archive > li {
      @apply border-b border-line py-2.5 last:border-b-0;
    }

    .archive em {
      @apply text-sm text-muted not-italic;
    }

    .archive em a {
      @apply text-muted underline;
    }

    /* Career */
    .timeline {
      @apply mt-6 border-l-2 border-line;
    }

    .timeline > li {
      @apply relative mb-5 pl-6 before:absolute before:top-[9px] before:-left-[7px] before:size-3 before:rounded-full before:border-2 before:border-accent before:bg-page before:content-[''];
    }

    .timeline > li > strong:first-child {
      @apply block text-accent;
    }
  }
</style>
