# GITHUB_TOKEN is read from the environment, which avoids github.com rate limits.
max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 30
cache = true
max_cache_age = "1d"
accept = ["200..=204", "429"]
exclude_path = ["_site", "vendor"]
exclude = [
  # "Ментальное программирование I" (HappyDev): the video was removed (404). Kept until the owner replaces or drops it.
  "^https://www\\.youtube\\.com/watch\\?v=EEq1wdM2M2w$",
  # Placeholder hosts in the README.
  "^http://localhost",
]
